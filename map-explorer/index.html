<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Map Explorer — Wallscourt Farm Academy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231798d3'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='white' stroke-width='2.5'/%3E%3Cpath d='M6 16h20M16 6c-5 6-5 14 0 20M16 6c5 6 5 14 0 20' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=10.10.26i">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">
      <img src="../logo.png" alt="" onerror="this.style.display='none'">
      <div><b>Map Explorer</b><small>Wallscourt Farm Academy</small></div>
    </div>
    <button class="pick" id="yearBtn" aria-haspopup="true"><span class="lbl">Year</span><span id="yearTxt">All</span></button>
    <button class="pick" id="mapBtn" aria-haspopup="true"><span class="lbl">Map</span><span id="mapTxt">World</span></button>
    <nav class="seg" id="modeSeg" aria-label="Activity">
      <button data-mode="explore">🔍 Explore</button>
      <button data-mode="find">📍 Find it!</button>
      <button data-mode="grid">🗺️ OS maps</button>
      <button data-mode="compass">🧭 Compass</button>
      <button data-mode="globe">🌐 Lat &amp; long</button>
    </nav>
    <div class="tools">
      <button class="tool" id="penBtn" title="Draw on the map">✏️<span>Pen</span></button>
      <button class="tool" id="spotBtn" title="Spotlight">🔦<span>Spotlight</span></button>
      <button class="tool" id="teamsBtn" title="Teams">🏆<span>Teams</span></button>
      <button class="tool" id="setBtn" title="Settings">⚙️<span>Settings</span></button>
    </div>
  </header>

  <div id="teamStrip" hidden></div>

  <main id="stage">
    <div id="mapWrap">
      <svg id="map" xmlns="http://www.w3.org/2000/svg">
        <defs id="defs"></defs>
        <g id="layers"></g>
        <g id="overlay"></g>
      </svg>
      <div id="rulerB" class="ruler rb" hidden></div>
      <div id="rulerL" class="ruler rl" hidden></div>
      <canvas id="ink"></canvas>
      <div id="zoomBar">
        <button id="zIn" aria-label="Zoom in">＋</button>
        <button id="zOut" aria-label="Zoom out">－</button>
        <button id="zHome" aria-label="Whole map">⌂</button>
      </div>
      <div id="viewBar"></div>
      <div id="layerBtnWrap"><button id="projBtn" hidden>🌍 Gall-Peters ▾</button><button id="symBtn">📍 Symbols</button><button id="layerBtn">🗂️ Layers</button></div>
      <div id="inkBar" hidden>
        <button data-ink="#e53935" class="sw" style="--c:#e53935"></button>
        <button data-ink="#1e88e5" class="sw" style="--c:#1e88e5"></button>
        <button data-ink="#111" class="sw" style="--c:#111"></button>
        <button id="inkClear">Clear</button>
        <button id="inkDone">Done</button>
      </div>
      <div id="scaleBar" hidden></div>
      <div id="mapKey" hidden></div>
      <div id="attrib"></div>
    </div>
    <aside id="panel">
      <button id="panelToggle" aria-label="Hide or show panel">⟩</button>
      <div id="panelBody"></div>
    </aside>
  </main>
</div>

<div id="pop" hidden></div>
<div id="modal" hidden><div class="mbox"><div id="modalBody"></div></div></div>
<div id="toast" hidden></div>

<script src="map-data.js?v=10.10.26i"></script>
<script src="app.js?v=10.10.26i"></script>
</body>
</html>
