<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Spelling Games — Wallscourt Farm Academy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wallscourtfarm/wfa-shared@main/web/wfa.css">
<style>
  :root { --max-w: 900px; }
  .panel{
    background:#fff; border-radius:16px; padding:20px 22px 24px; margin-bottom:22px;
    box-shadow:0 8px 20px rgba(18,38,58,.08);
  }
  .hello{ font-size:16px; font-weight:800; margin-bottom:2px; }
  .hello span{ color:#1798d3; }
  .subtle{ font-size:13px; color:#5b7a8a; margin:0 0 14px; }
  .banner-error{
    background:#fdeceb; border:1.5px solid #f3b7b3; color:#a3231f;
    border-radius:12px; padding:10px 14px; font-size:13px; font-weight:600; margin-bottom:14px;
  }
  .field-row{ display:flex; gap:12px; flex-wrap:wrap; }
  .field-row > div{ flex:1; min-width:160px; }
  label.field-label{ display:block; font-size:12.5px; font-weight:700; margin-bottom:5px; color:#5b7a8a; }
  select{
    width:100%; font-size:16px; padding:11px 12px; border-radius:10px;
    border:2px solid #cfe2ec; outline:none; font-family:inherit; background:#fff; color:#12263a;
  }
  select:focus{ border-color:#1798d3; }
  .week-note{ font-size:12px; color:#5b7a8a; margin-top:8px; }

  .games-heading{ font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.8px; color:#5b7a8a; margin:0 0 10px; }
  a.card.off, div.card.off{
    opacity:.55; cursor:default; pointer-events:none; background:#f5f8fa;
  }
  .card .avail-note{ font-size:11.5px; font-weight:700; margin-top:4px; }
  .card:not(.off) .avail-note{ color:#2fbf71; }
  .card.off .avail-note{ color:#93a7b3; }
  .empty-hint{ font-size:13.5px; color:#5b7a8a; padding:8px 2px; }
</style>
</head>
<body>

<header>
  <div class="header-content">
    <img class="logo" src="https://cdn.jsdelivr.net/gh/wallscourtfarm/wfa-shared@main/web/wfa_logo.webp" alt="Wallscourt Farm Academy">
    <div>
      <h1>🎯 My Spelling Games</h1>
      <p>Pick your week, see everything you can play right now</p>
    </div>
  </div>
</header>

<main>
  <div class="panel">
    <div id="identity-banner" style="display:none;" class="banner-error"></div>
    <div id="identity-hello" style="display:none;" class="hello">Hi <span id="identity-name"></span>!</div>
    <p class="subtle" id="identity-sub"></p>

    <div class="field-row">
      <div id="year-field">
        <label class="field-label" for="pick-year">Year group</label>
        <select id="pick-year"><option value="">Choose…</option></select>
      </div>
      <div>
        <label class="field-label" for="pick-term">Term</label>
        <select id="pick-term"><option value="">Choose a year first…</option></select>
      </div>
      <div>
        <label class="field-label" for="pick-week">Week</label>
        <select id="pick-week"><option value="">Choose a term first…</option></select>
      </div>
    </div>
    <div class="week-note" id="week-note"></div>
  </div>

  <div class="games-heading">Games for this week</div>
  <div class="grid" id="games-grid"></div>
</main>

<div class="footer">
  Wallscourt Farm Academy &mdash; Part of Cabot Learning Federation
</div>

<script src="../lessons-data.js"></script>
<script src="../spelling-pool.js"></script>
<script src="../roster.js"></script>
<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);

let identifiedPupil = null;

function findPupil(code) {
  return (typeof ROSTER !== "undefined" ? ROSTER : []).find(p => p.id.toUpperCase() === code.toUpperCase());
}

function populateYearSelect(selectEl, selected) {
  selectEl.innerHTML = '<option value="">Choose…</option>' +
    spGetYears().map(y => `<option value="${y}" ${y === selected ? "selected" : ""}>${y.replace("Y", "Year ")}</option>`).join("");
}

function populateTermWeek(year, selectedTerm, selectedWeek) {
  const weeks = year ? spGetWeeksForYear(year) : [];
  const terms = [...new Set(weeks.map(w => w.term))];
  const termSel = $("pick-term");
  if (!year) {
    termSel.innerHTML = '<option value="">Choose a year first…</option>';
    $("pick-week").innerHTML = '<option value="">…</option>';
    return;
  }
  termSel.innerHTML = '<option value="">Choose…</option>' +
    terms.map(t => `<option value="${t}" ${t === selectedTerm ? "selected" : ""}>${(spGetWeeksForYear(year).find(w => w.term === t).label).split(" — ")[0]}</option>`).join("");
  populateWeekSelect(year, termSel.value || selectedTerm, selectedWeek);
}

function populateWeekSelect(year, term, selectedWeek) {
  const weekSel = $("pick-week");
  if (!term) { weekSel.innerHTML = '<option value="">Choose a term first…</option>'; return; }
  const weeksInTerm = spGetWeeksForYear(year).filter(w => w.term === term);
  weekSel.innerHTML = '<option value="">Choose…</option>' +
    weeksInTerm.map(w => `<option value="${w.week}" ${w.week === selectedWeek ? "selected" : ""}>${w.label.split(" — ")[1]}</option>`).join("");
}

function currentSelection() {
  return { year: $("pick-year").value, term: $("pick-term").value, week: $("pick-week").value };
}

function renderGames() {
  const { year, term, week } = currentSelection();
  const grid = $("games-grid");
  if (!year || !term || !week) {
    grid.innerHTML = '<p class="empty-hint">Pick a year group and week above to see what you can play.</p>';
    return;
  }
  grid.innerHTML = GAMES.map(game => {
    const available = !game.isAvailable || game.isAvailable(year, term, week);
    const target = new URL("../" + game.path, location.href);
    if (identifiedPupil) target.searchParams.set("u", identifiedPupil.id);
    target.searchParams.set("y", year);
    target.searchParams.set("t", term);
    target.searchParams.set("w", week);
    const tag = `<div class="card-icon">${game.icon}</div><h3>${game.label}</h3><p class="avail-note">${available ? "✓ Ready to play" : "Not this week"}</p>`;
    return available
      ? `<a class="card" href="${target.href}">${tag}</a>`
      : `<div class="card off">${tag}</div>`;
  }).join("");
}

$("pick-year").addEventListener("change", () => {
  populateTermWeek($("pick-year").value, "", "");
  renderGames();
});
$("pick-term").addEventListener("change", () => {
  populateWeekSelect($("pick-year").value, $("pick-term").value, "");
  renderGames();
});
$("pick-week").addEventListener("change", renderGames);

(async function boot() {
  const live = await spFetchLiveRoster(BACKEND_URL);
  if (live) {
    if (live.roster && live.roster.length) ROSTER = live.roster;
    if (live.currentWeek) CURRENT_WEEK = live.currentWeek;
  }

  const uParam = (params.get("u") || "").trim().toUpperCase();
  if (uParam) {
    identifiedPupil = findPupil(uParam);
    if (identifiedPupil) {
      $("identity-hello").style.display = "block";
      $("identity-name").textContent = identifiedPupil.name;
      $("identity-sub").textContent = `Year ${identifiedPupil.year.replace("Y", "")} — here's what's ready for you to play.`;
      $("year-field").style.display = "none";
    } else {
      $("identity-banner").style.display = "block";
      $("identity-banner").textContent = "We didn't recognise that code — pick your year group below instead.";
      $("identity-sub").textContent = "Pick your year group and week to see your games.";
    }
  } else {
    $("identity-sub").textContent = "Pick your year group and week to see your games.";
  }

  const paramYear = identifiedPupil ? identifiedPupil.year : (params.get("y") || "");
  const paramTerm = params.get("t") || (paramYear ? CURRENT_WEEK.term : "");
  const paramWeek = params.get("w") || (paramYear ? CURRENT_WEEK.week : "");

  populateYearSelect($("pick-year"), paramYear);
  if (identifiedPupil) $("pick-year").disabled = true;
  populateTermWeek(paramYear, paramTerm, paramWeek);
  renderGames();

  if (paramYear && paramTerm && paramWeek) {
    const weeks = spGetWeeksForYear(paramYear);
    const known = weeks.find(w => w.term === paramTerm && w.week === paramWeek);
    $("week-note").textContent = known ? "" : "That week wasn't recognised — pick one from the list.";
  }
})();
</script>
</body>
</html>
