<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sentence Builder — Wallscourt Farm Academy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231798d3'/%3E%3Crect x='4' y='12' width='7' height='8' rx='2' fill='%23e8792e'/%3E%3Crect x='12.5' y='12' width='7' height='8' rx='2' fill='%23f2c94c'/%3E%3Crect x='21' y='12' width='7' height='8' rx='2' fill='%234caf6d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=10.10.26d">
</head>
<body>
<header id="top">
  <a class="brand" href="#" id="homeLink">
    <img src="../logo.png" alt="" onerror="this.style.display='none'">
    <div><b>Sentence Builder</b><small>Wallscourt Farm Academy</small></div>
  </a>
  <div id="stepTag" hidden></div>
  <div class="tools">
    <button class="tool" id="homeBtn" hidden>🏠<span>Pictures</span></button>
    <button class="tool" id="setBtn" title="Teacher settings">⚙️<span>Teacher</span></button>
  </div>
</header>

<main id="home">
  <section class="intro">
    <h1>Build a sentence that makes sense</h1>
    <p>Choose your step, then choose a picture.</p>
  </section>
  <section>
    <button class="write-card" id="writeCard"><span class="big">📝</span><span><b>Check my own writing</b><small>Type your sentence. Hear it read back. See each idea in colour and fix run-ons and missing doing words.</small></span></button>
  </section>
  <section>
    <h2>1. Choose your step</h2>
    <div id="stepCards" class="step-cards"></div>
  </section>
  <section>
    <h2>2. Choose a picture</h2>
    <div id="topicTabs" class="topic-tabs"></div>
    <div id="picGrid" class="pic-grid"></div>
  </section>
  <section>
    <h2>Or fix a sentence</h2>
    <p class="note" id="fixNote"></p>
    <div id="fixCards" class="step-cards"></div>
  </section>
</main>

<main id="build" hidden>
  <div class="pic-panel">
    <img id="pic" alt="">
    <div id="picTitle"></div>
  </div>
  <div class="work">
    <div class="line-wrap">
      <div id="line" class="line" aria-live="polite"></div>
      <div id="lineTools" class="line-tools"></div>
    </div>
    <div id="coach" class="coach" aria-live="polite"></div>
    <div id="bank" class="bank"></div>
  </div>
</main>

<footer id="foot">Sentence Builder · Version <span id="ver"></span> · No pupil information is stored.</footer>

<div id="modal" class="modal" hidden><div class="modal-box" id="modalBox"></div></div>

<script src="content.js?v=10.10.26d"></script>
<script src="topics/settings.js?v=10.10.26d"></script>
<script src="topics/characters.js?v=10.10.26d"></script>
<script src="topics/history-more.js?v=10.10.26d"></script>
<script src="topics/science.js?v=10.10.26d"></script>
<script src="topics/geography.js?v=10.10.26d"></script>
<script src="engine.js?v=10.10.26d"></script>
<script src="app.js?v=10.10.26d"></script>
</body>
</html>
